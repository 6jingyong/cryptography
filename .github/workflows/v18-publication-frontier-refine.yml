name: v18-publication-frontier-refine

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile refinement harness
        run: python -m py_compile protocol/v18-publication-frontier-refine.py src/noisy_host_package_v18_deterministic.py
      - name: Run fresh-seed frontier refinement
        run: |
          python protocol/v18-publication-frontier-refine.py \
            --base protocol/v18-publication-damage.py \
            --engine src/noisy_host_package_v18_deterministic.py \
            --protocol protocol/real-package-v18.py \
            --seeds 401,402,403,404,405,406,407,408 \
            --payload-bytes 512 \
            --channels 2 \
            --corpus-size 2000 \
            --near-decoy-fraction 0.01 \
            --top-k 100 \
            --out /tmp/v18-publication-frontier-refine.json
      - name: Upload refinement evidence
        uses: actions/upload-artifact@v4
        with:
          name: v18-publication-frontier-refine
          path: /tmp/v18-publication-frontier-refine.json
          if-no-files-found: error
