name: v18-residual-matrix

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  matrix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile matrix harness
        run: python -m py_compile protocol/v18-residual-matrix.py
      - name: Run frozen residual-model matrix
        run: |
          python protocol/v18-residual-matrix.py \
            --engine src/noisy_host_package_v18.py \
            --protocol protocol/real-package-v18.py \
            --seeds 201,202,203,204 \
            --payload-bytes 512 \
            --channels 2 \
            --corpus-size 2000 \
            --top-k 100 \
            --out /tmp/v18-residual-matrix.json
      - name: Upload residual-model evidence
        uses: actions/upload-artifact@v4
        with:
          name: v18-residual-matrix
          path: /tmp/v18-residual-matrix.json
          if-no-files-found: error
