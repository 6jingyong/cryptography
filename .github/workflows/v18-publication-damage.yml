name: v18-publication-damage

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  damage-frontier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile frontier harness
        run: python -m py_compile protocol/v18-publication-damage.py
      - name: Run frozen publication-damage frontier
        run: |
          python protocol/v18-publication-damage.py \
            --engine src/noisy_host_package_v18.py \
            --protocol protocol/real-package-v18.py \
            --seeds 301,302,303,304 \
            --payload-bytes 512 \
            --channels 2 \
            --corpus-size 2000 \
            --near-decoy-fraction 0.01 \
            --top-k 100 \
            --out /tmp/v18-publication-damage.json
      - name: Upload publication-damage evidence
        uses: actions/upload-artifact@v4
        with:
          name: v18-publication-damage
          path: /tmp/v18-publication-damage.json
          if-no-files-found: error
