name: v20-failure-envelope

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  envelope:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile failure-envelope harness
        run: python -m py_compile protocol/v20-failure-envelope.py
      - name: Run fixed-geometry V20 failure envelope
        run: |
          python protocol/v20-failure-envelope.py \
            --engine src/noisy_host_package_v18.py \
            --v20 protocol/real-package-v20.py \
            --statistics protocol/v18-publication-statistics.py \
            --seeds 801,802,803,804,805,806,807,808,809,810,811,812,813,814,815,816,817,818,819,820,821,822,823,824 \
            --payload-bytes 512 --channels 2 \
            --out /tmp/v20-failure-envelope.json
      - name: Upload failure-envelope evidence
        uses: actions/upload-artifact@v4
        with:
          name: v20-failure-envelope
          path: /tmp/v20-failure-envelope.json
          if-no-files-found: error
