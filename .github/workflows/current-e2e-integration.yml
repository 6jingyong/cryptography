name: current-e2e-integration

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile integration runner
        run: python -m py_compile tools/current_end_to_end.py src/noisy_host_package_v18_deterministic.py
      - name: Run current end-to-end synthetic bundle
        run: |
          python tools/current_end_to_end.py \
            --v20 protocol/real-package-v20.py \
            --engine src/noisy_host_package_v18_deterministic.py \
            --paper-tool tools/paper_v6.py \
            --seeds 901,902,903,904,905,906,907,908 \
            --representative-seed 901 \
            --payload-bytes 512 \
            --channels 2 \
            --corpus-size 2000 \
            --near-decoy-fraction 0.01 \
            --top-k 100 \
            --out-dir /tmp/current-e2e-bundle
      - name: Upload current end-to-end bundle
        uses: actions/upload-artifact@v4
        with:
          name: current-e2e-bundle
          path: /tmp/current-e2e-bundle
          if-no-files-found: error
