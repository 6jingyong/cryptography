name: structural-parity-v3

on:
  push:
    branches: [structural-parity-v3-20261103]
  workflow_dispatch:

jobs:
  structural-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile frozen candidate
        run: |
          python -m py_compile protocol/structural-parity-v3.py
          python -m py_compile protocol/real-package-v20.py
          python -m py_compile src/noisy_host_package_v18_deterministic.py
      - name: Run frozen structural parity matrix
        run: |
          python protocol/structural-parity-v3.py \
            --engine src/noisy_host_package_v18_deterministic.py \
            --v20 protocol/real-package-v20.py \
            --seeds 1201,1202,1203,1204,1205,1206,1207,1208,1209,1210,1211,1212,1213,1214,1215,1216,1217,1218,1219,1220,1221,1222,1223,1224 \
            --payload-bytes 512 \
            --channels 2 \
            --corpus-size 2000 \
            --out /tmp/structural-parity-v3.json \
            --summary-out /tmp/structural-parity-v3.md
      - name: Upload frozen evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: structural-parity-v3
          path: |
            /tmp/structural-parity-v3.json
            /tmp/structural-parity-v3.md
          if-no-files-found: warn
